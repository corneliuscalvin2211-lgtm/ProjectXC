<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Online Shopping System</title>
     <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Payment</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <main>
        <h2>Choose Payment Method</h2>

        <form id="payment-form">

            <label>
                <input type="radio" name="payment" value="card" required>
                Debit/Credit Card
            </label>
            <br><br>

            <label>
                <input type="radio" name="payment" value="transfer">
                Bank Transfer
            </label>
            <br><br>

            <label>
                <input type="radio" name="payment" value="cash">
                Cash on Delivery
            </label>

            <div id="bank-fields" hidden>
    <label for="bank">Choose your bank:</label><br>
    <select id="bank" name="bank">
        <option value="">Select a bank</option>
        <option value="access">Access Bank</option>
        <option value="first">First Bank</option>
        <option value="gtb">GTBank</option>
        <option value="uba">UBA</option>
        <option value="zenith">Zenith Bank</option>
    </select>
    <br><br>
</div>

<div id="card-fields" hidden>
    <label for="card-number">Card Number:</label><br>
    <input type="text" id="card-number" name="cardNumber"
           autocomplete="cc-number" inputmode="numeric">
    <br><br>

    <label for="card-name">Name on Card:</label><br>
    <input type="text" id="card-name" name="cardName"
           autocomplete="cc-name">
    <br><br>

    <label for="card-expiry">Expiry Date:</label><br>
    <input type="text" id="card-expiry" name="cardExpiry"
           placeholder="MM/YY" autocomplete="cc-exp">
    <br><br>

    <label for="card-cvv">Security Code:</label><br>
    <input type="text" id="card-cvv" name="cardCvv"
           inputmode="numeric" autocomplete="cc-csc">
    <br><br>
</div>



            <br><br>

            <button type="submit" onclick="window.location.href='confirmation.html'">Make Payment</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Online Shopping System</p>
    </footer>

    <script src="js/payment.js"></script>
</body>
</html>
