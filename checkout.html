<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Online Shopping System</title>
     <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Checkout</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <main>
        <h2>Customer Information</h2>

        <form>

            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="country">Country:</label><br>
<select id="country"
        name="country"
        onchange="document.getElementById('country-prefix').textContent = this.value">
    <option value="+234" selected>Nigeria (+234)</option>
    <option value="+233">Ghana (+233)</option>
    <option value="+27">South Africa (+27)</option>
    <option value="+44">United Kingdom (+44)</option>
    <option value="+1">United States/Canada (+1)</option>
</select>
<br><br>

<label for="phone">Phone Number:</label><br>
<span id="country-prefix">+234</span>
<input type="tel" id="phone" name="phone" required>
<br><br>

            <label for="address">Delivery Address:</label><br>
            <textarea id="address" name="address" rows="4" required></textarea>
            <br><br>

            <button type="submit" onclick="window.location.href='payment.html'">Continue to Payment</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Online Shopping System</p>
    </footer>

</body>
</html>
